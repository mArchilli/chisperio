<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6000ca">
    <title>Sin conexión — Chisperío</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fcf9f8;
            color: #1f1b24;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }
        main { max-width: 360px; }
        img { width: 200px; height: auto; }
        h1 { margin: 16px 0 8px; font-size: 1.5rem; }
        p { margin: 0 0 24px; line-height: 1.5; color: #555; }
        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 28px;
            background: #6000ca;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo-chisperio.png" alt="Chisperío">
        <h1>Sin conexión</h1>
        <p>No pudimos conectarnos. Revisá tu conexión a internet e intentá de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
